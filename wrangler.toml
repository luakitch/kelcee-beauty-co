# Cloudflare Workers — static Next.js export (output: "export" → out/)
#
# Dashboard build settings (Workers & Pages → kelcee-beauty-co → Settings → Builds):
#   Build command:  npm run build
#   Deploy command: npm run deploy     (NOT npx wrangler deploy — passes Supabase vars + --env="")
#
# Configure TWO build triggers:
#   Production → branch: main
#   Preview    → branch: staging  (or * for all non-main)
#
# Workers Builds sets WORKERS_CI_BRANCH automatically — not CF_PAGES_BRANCH.
#
# URLs:
#   Production:  https://kelceehairco.com          (main branch)
#   Preview:     https://preview.kelceehairco.com  (staging/preview branch)
#
# kelceehairco.com must be on Cloudflare DNS for custom domains to auto-provision.
#
name = "kelcee-beauty-co"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
preview_urls = true

# Production only (preview env has no cron block).
[triggers]
crons = ["0 12 * * *"]

[assets]
directory = "./out"
binding = "ASSETS"

# Preview environment — separate Worker, own custom domain.
[env.preview]
name = "kelcee-beauty-co-preview"

[env.preview.assets]
directory = "./out"
binding = "ASSETS"

[[env.preview.routes]]
pattern = "preview.kelceehairco.com"
custom_domain = true
