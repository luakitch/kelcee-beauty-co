# Cloudflare Pages — static Next.js export (output: "export" → out/)
#
# Cloudflare dashboard build settings:
#   Build command:  npm run build
#   Output dir:     out
#   Deploy command: npm run deploy  (or leave empty)
#   Do NOT use: npx wrangler deploy
#
name = "kelcee-beauty-co"
compatibility_date = "2024-09-23"
pages_build_output_dir = "out"

# Fallback when Cloudflare runs `npx wrangler deploy` after the build.
[assets]
directory = "./out"
